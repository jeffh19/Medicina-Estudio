<style>
:root{--ink:#14313a;--teal:#0f6b73;--bg:#f4f7f7;--card:#fff;--line:#cfdcde;--c:#e6f0fa;--m:#fff3d6;--w:#fde8e6;--e:#efe8fa;--ok:#1d7a46;--bad:#b3261e}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}

aside{background:var(--ink);color:#e8f1f2;padding:14px;position:sticky;top:0;height:100vh;overflow:auto}

.bar{height:8px;background:#35606a;border-radius:4px;margin:8px 0}.bar i{display:block;height:100%;background:#7fe0a5;border-radius:4px;width:0}
.modes{display:flex;gap:6px;margin:8px 0}.modes button{flex:1;text-align:center;border:1px solid #5b858f;border-radius:6px}.modes button.on{background:#7fe0a5;color:#0b2a30}
main{padding:22px clamp(14px,4vw,40px);max-width:960px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:12px 0}
.box{border-radius:6px;padding:10px 14px;margin:10px 0;border-left:5px solid}
.c{background:var(--c);border-color:#2b6cb0}.m{background:var(--m);border-color:#c98a00}.w{background:var(--w);border-color:var(--bad)}.e{background:var(--e);border-color:#6b46c1}
.box b:first-child{display:block}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.93rem}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:#e1ecee}

.fc{min-height:150px;display:grid;place-items:center;text-align:center;font-size:1.1rem;cursor:pointer;background:var(--m);border:2px solid #c98a00;border-radius:10px;padding:18px}.fc.back{background:var(--c);border-color:#2b6cb0}
.q{border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0;background:#fff}.q label{display:block;padding:4px 6px;border-radius:5px;cursor:pointer}
.q .ok{background:#d9f2e3}.q .no{background:#fbd9d5}.fb{margin-top:6px;font-size:.92rem}
.score{font-size:1.5rem;font-family:Georgia,serif}.tag{font-size:.78rem;background:#e1ecee;border-radius:10px;padding:1px 8px;margin-right:6px}

<script>
const $=s=>document.querySelector(s);let mode=0,cur=0,done=new Set();
const T=(h,rows)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
const B=(k,t,x)=>`<div class="box ${k}"><b>${t}</b>${x}</div>`;
const steps=[["Picadura","La hembra hematófaga infectada (Lutzomyia en el Nuevo Mundo, Phlebotomus en el Viejo) pica para obtener sangre."],["Inoculación","Inocula promastigotos metacíclicos: forma infectante para el humano."],["Entrada al macrófago","Los promastigotos penetran en monocitos o macrófagos (células del SRE) mediante receptores específicos."],["Transformación","Dentro de la célula se transforman en amastigotos."],["Multiplicación","Se multiplican por fisión binaria, solo dentro de estas células (parásito intracelular obligado)."],["Nuevas células","In situ o diseminándose por distintos tejidos según la especie, infectan nuevas células. Son la forma infectante para el vector."],["Ingestión por el vector","Otro flebótomo ingiere sangre con macrófagos parasitados."],["Amastigoto → promastigoto","En el intestino medio del mosquito los amastigotos se transforman en promastigotos."],["Multiplicación y migración","Se dividen profusamente por fisión binaria; a los 8 días migran a la faringe (fig. 27-2 del atlas)."],["Nueva transmisión","En la siguiente picadura se inoculan a un hospedero susceptible y el ciclo continúa."]];
const M=[
["1. Generalidades",()=>`<h2>Generalidades</h2>`+B("c","Definición (atlas y diapositivas)","Histoparasitosis producida por protozoos del género <i>Leishmania</i>, de localización intracelular (macrófagos), con lesiones cutáneas, mucosas o viscerales, transmitida por la picadura de flebótomos (<i>Phlebotomus</i>, <i>Lutzomyia</i>; familia Phlebotomidae).")+T(["Concepto","Dato"],[["Agente","Protozoo flagelado, género <i>Leishmania</i>"],["Ciclo","Heteroxénico: intestino del insecto vector y tejidos de un vertebrado"],["Localización","Intracelular: macrófagos, células del sistema reticuloendotelial (SRE)"],["Hospederos","Vertebrados (reservorios silvestres y domésticos); el humano es hospedero accidental"],["Transmisión","Picadura de la hembra del flebótomo"],["Zoonosis","Sí. Excepción: kala-azar de la India (humano–vector–humano, antropozoonosis)"],["Especies","15 afectan al hombre: 10 en el Nuevo Mundo y 5 en el Viejo Mundo"],["Taxonomía","Morfología muy similar: se usan isoenzimas (zimodemas), anticuerpos monoclonales (serodemas), ADN del quinetoplasto (esquizodemas) y comportamiento biológico"]])+B("m","Memorizar","Histoparasitosis · intracelular · 15 especies (10 NM / 5 VM) · humano = hospedero accidental · formas clínicas: cutánea, mucocutánea, visceral.")],
["2. Morfología",()=>`<h2>Morfología y biología</h2>`+T(["","Amastigoto","Promastigoto"],[["Forma","Ovoide o esférica","Fusiforme"],["Tamaño","2–5 µm de diámetro","14–20 µm de largo × 2–4 µm de ancho"],["Núcleo / cinetoplasto","Núcleo redondo; quinetoplasto en forma de bastón","—"],["Flagelo","Sin flagelo libre","Flagelado"],["Dónde","Intracelular, en macrófagos de hospedero vertebrado","Tubo digestivo del vector y cultivos <i>in vitro</i>"],["Utilidad","Diagnóstico en frotis/biopsia (Giemsa)","Diagnóstico por cultivo (NNN); también en el vector"]])+B("e","Error frecuente","Amastigoto = sin flagelo libre y dentro de la célula. Promastigoto = flagelado y extracelular (vector/cultivo).")+`<svg viewBox="0 0 520 120" width="100%" role="img" aria-label="Esquema de amastigoto y promastigoto"><ellipse cx="90" cy="60" rx="45" ry="38" fill="#e6f0fa" stroke="#14313a"/><circle cx="80" cy="55" r="12" fill="#0f6b73"/><rect x="100" y="58" width="16" height="5" fill="#b3261e"/><text x="90" y="112" text-anchor="middle" font-size="13">Amastigoto (sin flagelo libre)</text><ellipse cx="330" cy="55" rx="70" ry="15" fill="#e6f0fa" stroke="#14313a"/><circle cx="335" cy="55" r="8" fill="#0f6b73"/><rect x="305" y="52" width="10" height="5" fill="#b3261e"/><path d="M400 55 Q440 30 480 60" stroke="#14313a" fill="none" stroke-width="2"/><text x="400" y="112" text-anchor="middle" font-size="13">Promastigoto (flagelo)</text></svg><small>Esquema ilustrativo propio (núcleo azul-verde, cinetoplasto rojo).</small>`],
["3. Ciclo biológico",()=>`<h2>Ciclo biológico</h2><p>Haz clic en cada etapa.</p><div id="stp">${steps.map((s,i)=>`<div class="step" onclick="stp(${i})"><span>${i+1}</span><div><b>${s[0]}</b><div class="ans">${s[1]}</div></div></div>`).join('')}</div>`+T(["Pregunta","Forma"],[["Infectante para el humano","Promastigoto metacíclico"],["Intracelular","Amastigoto"],["Infectante para el vector","Amastigoto (en macrófagos)"],["En cultivos","Promastigoto"]])+`<div class="card"><b>Pregunta rápida:</b> ¿Qué forma ingiere el flebótomo?<br><button class="b g" onclick="this.nextElementSibling.classList.add('show')">Ver respuesta</button><span class="ans">Amastigotos dentro de macrófagos; en el intestino medio pasan a promastigotos.</span></div>`],
["4. Taxonomía y especies",()=>`<h2>Taxonomía y especies</h2>`+T(["Complejo (diapositivas)","Especies","Forma clínica","Notas"],[["donovani","L. donovani, L. infantum, L. chagasi","Visceral (kala-azar)","donovani: India, China, África, Irak; infantum: Mediterráneo; chagasi: América"],["tropica","L. tropica, L. major, L. aethiopica","Cutánea del Viejo Mundo","Botón de Oriente"],["mexicana","L. mexicana, L. amazonensis, L. venezuelensis, L. pifanoi, L. garnhami","Tegumentaria (cutánea/difusa)","amazonensis está en Perú"],["braziliensis","L. braziliensis, L. guyanensis, L. panamensis, L. peruviana, L. colombiensis","Cutánea y mucocutánea","<i>L. (Viannia) braziliensis</i> es la más importante y más agresiva"]])+B("w","Discrepancia entre fuentes","El atlas (Tabla 27-1) ubica a <i>L. chagasi</i> en el complejo donovani del subgénero <i>Leishmania</i> del Nuevo Mundo, ordena <i>tropica/major/aethiopica</i> en el Viejo Mundo sin complejo propio y lista <i>L. paramensis</i> (probable error de <i>panamensis</i>) y <i>lainsonai</i>. Las diapositivas escriben “mayor” y “pifano”. Son diferencias de clasificación y de ortografía; para el examen sigue las diapositivas.")+B("c","En el Perú (diapositivas)","L. (V) braziliensis · L. (V) guyanensis · L. (V) peruviana · L. (V) lainsoni · L. (L) amazonensis. Banco de preguntas: Puno = <i>L. braziliensis</i>; costa = <i>L. peruviana</i>.")+B("m","Visceral en Perú","No se han reportado casos autóctonos de LV en Ecuador, Perú, Chile ni Uruguay (atlas y diapositivas).")],
["5. Vectores y epidemiología",()=>`<h2>Vectores, reservorios y epidemiología</h2>`+T(["","Phlebotomus","Lutzomyia"],[["Mundo","Viejo Mundo","Nuevo Mundo (&gt;350 flebótomos, 88 vectores potenciales)"],["Sexo que pica","Hembra hematófaga (necesita sangre para reproducirse)","Igual"],["Hábitat","—","Zonas rurales; sitios oscuros y húmedos (huecos de árboles, cuevas, resquicios entre piedras)"]])+T(["Patrón","Dónde ocurre la picadura","Afectados"],[["Intradomiciliario","El vector entra a las casas","Ambos sexos; si es básicamente intradomiciliario, niños &lt;4 años (atlas) / preescolares (diapositivas)"],["Peridomiciliario","Alrededor del domicilio","Ambos sexos"],["Rural","Bosque o trabajo agrícola en el foco","Adultos, sobre todo varones"]])+B("c","Reservorios","Naturales: vertebrados silvestres (principalmente roedores). Animales domésticos: reservorios secundarios. Animales infectados suelen no tener lesiones visibles: se requiere biopsia o cultivo.")+B("m","Perú y Andes","Se presenta desde el sur de EE. UU. hasta el norte de Argentina. En zonas andinas de Perú y Ecuador se relaciona con la altitud del vector (700 a 3 000 m s. n. m.). Nombres: <b>uta</b> (cutánea, Perú; quechua “roer”), <b>espundia</b> (cutáneo-mucosa, Perú y Bolivia), úlcera de los chicleros (México), pian bois (Guayanas).")+B("w","Errata en diapositivas","La diapositiva dice “700 a 300 m”; el atlas dice 700 a 3 000 m.")+B("e","Trampa del banco","El banco de preguntas marca “Phlebotomus” como vector del Nuevo Mundo. Atlas, diapositivas y el otro banco dicen <b>Lutzomyia</b>. El banco también menciona “la manta blanca”, nombre que no aparece en atlas ni diapositivas.")],
["6. Formas clínicas",()=>`<h2>Formas clínicas</h2><h3>A. Visceral (kala-azar)</h3>`+B("c","Agentes","L. donovani (India, China, África, Irak), L. infantum (Mediterráneo), L. chagasi (América; vector principal <i>Lu. longipalpis</i>). Más del 90 % de casos: India, Bangladesh, Nepal y Sudán. Riesgo: desnutrición (niños) y perros infectados; zorro y zarigüeya mantienen la zoonosis.")+`<div class="flow"><div>Amastigotos en macrófagos del SRE</div><em>→</em><div>Hiperplasia del SRE + infiltrado linfomonocitario</div><em>→</em><div>Hepatoesplenomegalia (bazo nodular, fibrosis crónica)</div></div><div class="flow" style="margin-top:6px"><div>Amastigotos en médula ósea</div><em>→</em><div>Depresión de series roja y blanca</div><em>→</em><div>Anemia normocítica normocrómica, leucopenia con neutropenia, trombocitopenia (pancitopenia)</div><em>→</em><div>Hemorragias</div></div><div class="flow" style="margin-top:6px"><div>Menor defensa</div><em>→</em><div>Infecciones intercurrentes (TBC, neumonía, disentería, sarampión)</div></div>`+B("w","Complemento (no está en las fuentes)","Las fuentes enlazan la afectación medular con la pancitopenia; el mecanismo detallado de la trombocitopenia o del secuestro esplénico no se desarrolla en ellas.")+T(["Dato","Contenido"],[["Incubación","2–4 meses (3 semanas a más de 2 años)"],["Clínica clásica","Fiebre crónica, adelgazamiento, hepatoesplenomegalia (predomina esplenomegalia), pancitopenia, hipergammaglobulinemia; micropoliadenopatía, edema de miembros inferiores, retardo del crecimiento en niños; piel: nódulos, ulceraciones, hiper o despigmentación"],["Mayoría en zona endémica","Asintomáticos u oligosintomáticos (se recuperan solos)"],["Pronóstico","Sin tratamiento 85–90 % de mortalidad. Con tratamiento: &lt;5 % (atlas) o &lt;15 % (diapositivas). Peor con desnutrición, inmunidad celular deprimida y VIH"],["Secuela","Leishmaniosis dérmica poskalazar (≈20 % India, 5 % África)"]])+`<h3>B. Tegumentaria americana</h3><h4>Cutánea</h4><div class="flow"><div>Eritema pruriginoso</div><em>→</em><div>Pápula</div><em>→</em><div>Vesícula pustulosa de base indurada</div><em>→</em><div>Úlcera con costra</div><em>→</em><div>Cicatrización</div></div>`+B("c","Úlcera típica","Circular, bordes netos, edematosos y violáceos, indolora; al retirar la costra, fondo granulomatoso grueso, hiperémico y sangrante. Puede ser única, múltiple o confluir. Si se infecta: exudado blanco amarillento, mal olor, dolor, linfangitis y adenopatía. Zonas descubiertas (cara, miembros); rara en palmas, plantas y cuero cabelludo. Formas no ulceradas: placas infiltrativas, nódulos, verrucomas.")+`<h4>Mucocutánea (espundia)</h4><p>≈10 % de pacientes; aparece meses a años (&gt;30) después, casi siempre en los 5 primeros años y generalmente con la lesión cutánea ya cicatrizada.</p>`+T(["Compromiso","Manifestación"],[["Tabique nasal (tercio inferior o medio) → cornetes","Destrucción del cartílago; amputación del tabique: nariz de tapir o huanucoide"],["Paladar blando","Imagen en cruz: cruz de Escomel"],["Orofaringe y paladar (incluye úvula)","Lesiones granulares, hiperémicas, poco dolorosas, escaso sangrado"],["Epiglotis, cuerdas vocales, tráquea","Disfonía, disfagia, dificultad respiratoria"],["Casos crónicos","Infecciones respiratorias aspirativas, bronconeumonías, muerte"]])+B("m","Cartílago vs hueso","La destrucción afecta el <b>cartílago</b>, no el tejido óseo (atlas y diapositivas).")+`<h4>Cutánea difusa o anérgica</h4>`+B("c","Claves","Insuficiencia inmunitaria específica (anergia). Infiltración difusa de piel y tejido celular subcutáneo, con ondulaciones y aspecto de lepromas en la cara. Muchísimos histiocitos con parásitos; escasa formación de úlceras o granulomas. Se diferencia de la cutánea localizada por la ausencia de úlcera y granuloma y la abundancia de parásitos.")+`<h3>C. Cutánea del Viejo Mundo</h3>`+T(["","L. tropica","L. major","L. aethiopica"],[["Botón de Oriente","Seco","Húmedo","—"],["Distribución","Urbana (Mediterráneo, Asia)","Rural; zoonosis con roedores","Etiopía, Kenia"],["Lesión","Niños, cara, 1–2 cm; menos agresiva","Ulcerativa con exudado, 3–6 cm, miembros; no da metástasis a mucosas","Única en la cara; pápulas satélites; placas o úlceras"],["Incubación","2–4 meses","1 semana–2 meses","—"],["Evolución","Cura sola; cicatriz en bajo relieve","Cura dejando cicatriz","Cura lenta (2–5 años); la más agresiva, tiende a lesiones mucosas"]])],
["7. Histopatología",()=>`<h2>Histopatología y patogenia</h2>`+T(["Forma","Hallazgo","Correlación clínica"],[["Cutánea inicial","Pápula en la entrada; inflamación con hiperplasia epitelial y necrosis dérmica; exudado con polimorfonucleares; histiocitos con amastigotos en reproducción","Úlcera en ≈6 meses"],["Cutánea tardía","Reacción granulomatosa: linfocitos, células plasmáticas, epitelioides y gigantes de Langhans; disminuyen los parásitos","Cicatrización; parásitos difíciles de ubicar"],["Mucosa","Granulomatosa necrotizante, pocos parásitos, predominio de plasmáticas y linfáticas; pérdida de cartílago sin hueso; se vuelve fagedénica","Deformidad nasal, alteración de respiración y deglución, bronconeumonías"],["Difusa","Infiltrado nodular difuso del TCS con muchos histiocitos parasitados; pocos granulomas y úlceras; agregados de linfocitos y plasmáticas","Nódulos y lepromas"],["Visceral","Histiocitos con amastigotos en el sitio de entrada; bazo nodular (fibrosis), hepatomegalia por hiperplasia del SRE e infiltrado linfomonocitario de espacios porta; médula con depresión de series roja y blanca","Hepatoesplenomegalia, pancitopenia"]])],
["8. Diagnóstico",()=>`<h2>Diagnóstico</h2><p>Diagnóstico definitivo: demostración del parásito. Clínico (tegumentaria): lesión indolora de más de 4 semanas, fondo granulomatoso grueso, bordes indurados violáceos, más antecedente epidemiológico.</p>`+T(["Método","Muestra / técnica","Qué se busca o resultado"],[["Frotis","Borde de lesión reciente (raspado o aspirado), Giemsa, inmersión 30 min","Amastigotos libres o en histiocitos"],["Cultivo","Material triturado en medio NNN con sangre de conejo 15 %, 23 °C","Promastigotos; positivo en 3–30 días (usual 7–15)"],["Biopsia","Borde de la lesión","Histopatología y parásito; especie por hibridización de K-ADN y monoclonales"],["Montenegro (leishmanina)","Intradérmica de lisado de promastigotos","Pápula ≥5 mm a las 48 h; sens. &gt;90 %; positiva desde 1 mes; negativa en LV clásica grave por anergia; positiva tras curar"],["Serología (IFI, ELISA)","Suero","Reacción cruzada con Chagas y kala-azar; poco útil en tegumentaria"],["LV: hemograma","Sangre","Anemia normocítica normocrómica, leucopenia con neutropenia, trombocitopenia; hipergammaglobulinemia"],["LV: punciones","Médula (más factible), ganglios, bazo, hígado","Amastigotos en histiocitos (Giemsa). Bazo: sens. &gt;95 %, solo clínico entrenado, con TP normal y plaquetas &gt;40 000/mm³"],["LV: serología","Aglutinación directa; IFI; ELISA y DOT-ELISA","Aglutinación sens. 97–100 %, esp. 70 %. ELISA sens. 95–100 %, esp. 99 %"],["Inoculación","Hámster, ratón, rata","Aislamiento del parásito"]])+B("c","Diagnóstico diferencial (atlas)","LV: malaria, virosis y otros cuadros con hepatoesplenomegalia. Cutánea: lesiones piógenas, heridas contaminadas, úlceras varicosas, micosis cutáneas. Mucosa: micosis (en especial paracoccidioidomicosis), neoplasias de cavidad oral, linfomas, rinoescleroma, sífilis. Los criterios que los distinguen no se detallan en las fuentes.")+B("w","Diferencia","La diapositiva asocia biopsia con promastigotos; el atlas dice que frotis y biopsia muestran amastigotos y que los promastigotos aparecen en el cultivo.")],
["9. Tratamiento",()=>`<h2>Tratamiento</h2>`+T(["Fármaco","Línea","Notas"],[["Antimoniales pentavalentes: N-metilglucamina (Glucantime), estibogluconato (Pentostam)","Primera","Elección. Glucantime más usado en el Nuevo Mundo y Pentostam en el Viejo. Vía IV, IM o intralesional. Tóxicos: 2–4 semanas; evaluar corazón, riñón e hígado antes y durante. Contraindicados en gestantes"],["Anfotericina B (incluye liposomal), pentamidina","Segunda","Más tóxicas; uso intrahospitalario. En LV: falla a antimoniales o coinfección con VIH"],["Aminosidina","Segunda (LV)","Listada en atlas y diapositivas"],["Ketoconazol, alopurinol, rifampicina, levamisol, nifurtimox, fenotiazina, paromomicina tópica","Alternativas","Resultados variables, menos efectivas"]])+B("w","No uses estas dosis para tratar","Las diapositivas dan “60–100 mg cada 2–3 semanas” y “600 mg × 6–10 días” sin unidades claras; el banco da dosis en mg/kg incompatibles con ellas (p. ej. anfotericina 25–50 mg/kg) y el docx da otra pauta (Glucantime 20 mg/kg × 20 d, máx. 3 g/día). El atlas no da dosis. Verifica con protocolos clínicos vigentes.")+B("e","Viejo Mundo","<i>L. aethiopica</i> no suele responder a dosis usuales de antimoniales: se recomienda pentamidina.")],
["10. Prevención",()=>`<h2>Prevención y control</h2>`+T(["Eje","Medida"],[["Vector","Insecticidas de acción residual (efecto temporal; eficaces si la transmisión es intradomiciliaria); gestión ambiental"],["Diagnóstico y tratamiento","Precoz y oportuno, con búsqueda pasiva o activa de casos; en África e India, tratar la leishmaniosis dérmica poskalazar"],["Reservorios","Eliminar perros infectados (LV) y luchar contra reservorios"],["Protección personal","Repelentes o ropa impregnada con permetrina (útil para turistas)"],["Comunidad","Educación sanitaria y participación comunal; conocer hábitos del vector"]])],
["11. Banco de exámenes",()=>`<h2>Banco de preguntas de exámenes anteriores</h2><p>Preguntas de Leishmaniosis tomadas del PDF “Bancos para salvar el Susti” y, marcadas con <span class="tag">docx</span>, del archivo PARÁSITO-II. Ninguna tiene alternativas: responde de memoria, revela la respuesta y califícate. <b id="bsc"></b> <button class="b g" onclick="bReset()">Reiniciar</button></p><div id="bq"></div>`],
["12. Simulacro",()=>`<h2>Simulacro de examen</h2><div class="card">Modo actual: <b id="mm"></b>. Tiempo (min): <input id="tm" type="number" value="20" min="1" max="90" style="width:70px"> <button class="b" onclick="simStart()">Iniciar simulacro</button> <b id="tmr"></b><p><small>Estudio: retroalimentación al marcar. Examen: temporizador y corrección al final. Preguntas nuevas, elaboradas a partir de atlas, diapositivas y banco.</small></p></div><div id="sim"></div>`],
["13. Repaso rápido",()=>`<h2>Lo que no puedes olvidar</h2><div class="card"><div class="fc" id="fc" onclick="fcFlip()" tabindex="0" role="button"></div><p><button class="b g" onclick="fcMove(-1)">Anterior</button><button class="b g" onclick="fcMove(1)">Siguiente</button><button class="b g" onclick="fcShuf()">Barajar</button> <span id="fcn"></span></p></div>`+B("m","Confusiones clásicas","Amastigoto (sin flagelo libre, intracelular) ≠ promastigoto (flagelado, vector y cultivo). Lutzomyia (NM) ≠ Phlebotomus (VM). Cutánea (úlcera) ≠ mucocutánea (cartílago nasal) ≠ difusa (lepromas, anergia) ≠ visceral (pancitopenia, hepatoesplenomegalia). Biopsia y frotis = amastigotos; cultivo = promastigotos.")]
];
const FC=[["¿Qué tipo de parasitosis es la leishmaniosis?","Histoparasitosis por protozoo intracelular (macrófagos)."],["¿Qué vectores transmiten?","Hembras de Phlebotomus (VM) y Lutzomyia (NM)."],["¿Cuántas especies afectan al hombre?","15: 10 en el Nuevo Mundo y 5 en el Viejo Mundo."],["¿Rol del humano?","Hospedero accidental."],["¿Forma intracelular?","Amastigoto: ovoide, 2–5 µm, quinetoplasto en bastón, sin flagelo libre."],["¿Forma del vector y del cultivo?","Promastigoto: fusiforme, 14–20 × 2–4 µm."],["¿Especies en Perú?","braziliensis, guyanensis, peruviana, lainsoni (Viannia) y amazonensis (Leishmania)."],["¿Especie de Puno y de la costa?","Puno: L. braziliensis. Costa: L. peruviana (banco)."],["¿Más agresiva en América?","L. (V.) braziliensis."],["¿Hay LV autóctona en Perú?","No (tampoco Ecuador, Chile, Uruguay)."],["¿Vector más importante de LV americana?","Lutzomyia longipalpis (agente: L. chagasi)."],["Factores de riesgo de LV","Desnutrición y perros infectados."],["Hemograma en LV","Anemia normocítica normocrómica, leucopenia con neutropenia, trombocitopenia."],["Predomina en LV clásica","Fiebre, adelgazamiento, esplenomegalia, pancitopenia, hipergammaglobulinemia."],["Mortalidad de LV","85–90 % sin tratamiento."],["Secuencia de la lesión cutánea","Eritema → pápula → vesícula pustulosa → úlcera con costra."],["Úlcera típica","Circular, bordes violáceos, indolora, fondo granulomatoso."],["Lesión mucosa destruye…","Cartílago, no hueso."],["¿Cruz de Escomel?","Granulomas del paladar blando."],["¿Nariz de tapir?","Amputación del tabique nasal."],["Leishmaniosis difusa","Anergia, lepromas, muchos parásitos, pocas úlceras."],["Botón de Oriente seco / húmedo","L. tropica (urbano) / L. major (rural, roedores)."],["¿La más agresiva del VM?","L. aethiopica; se trata con pentamidina."],["Medio de cultivo","NNN con sangre de conejo, 23 °C."],["Montenegro","Pápula ≥5 mm a las 48 h; negativa en LV grave."],["Primera línea","Antimoniales pentavalentes (Glucantime, Pentostam)."],["Segunda línea","Anfotericina B, pentamidina, aminosidina."],["Contraindicado en gestantes","Antimoniales pentavalentes."],["Prevención","Insecticida residual, diagnóstico precoz, repelentes, educación."]];
const BQ=[["Importancia médica","Señala 4 parasitosis principales causas de morbimortalidad (Examen 1, P2).","Malaria, leishmaniasis, equistosomosis, filariosis.",""],["Importancia médica","Señala tres parasitosis causas de morbimortalidad (Examen 2, P15; revaluación Ex.1 P5 sin respuesta propia).","Malaria, leishmaniasis, filariasis.",""],["Patología","Parásito que produce la pigmentación patológica (Examen 1, P9).","Leishmaniasis.","Coincide con hiper y despigmentación cutánea de la LV (atlas). Ojo: el mismo banco afirma pigmentación patológica en la malaria (Examen 3, P11)."],["Patología","La pigmentación melánica es propia de (Examen 4, P18; revaluación Ex.1 P7).","Leishmaniasis.","Mismo punto que el anterior."],["Clasificación","Una clasificación práctica de la leishmaniasis se basa en el criterio… (Leishmaniasis P1; revaluación Ex.4 P4).","Clínico.","El docx responde “epidemiológicos y clínicos”. El atlas clasifica por forma clínica (cutánea, mucocutánea, visceral)."],["Especies","El agente etiológico en Puno es… y en la costa del país… (Leishmaniasis P6; también P2).","Puno: Leishmania braziliensis. Costa: Leishmania peruviana.","Coherente con las diapositivas (ambas están en la lista de Perú). <span class=tag>docx</span> repite la pregunta."],["Vector","El vector de la leishmaniasis en el Nuevo Mundo es… (Leishmaniasis P4; revaluación Ex.3 P5).","El banco responde PHLEBOTOMUS.","⚠ Discrepancia: atlas, diapositivas y docx dicen Lutzomyia; Phlebotomus es del Viejo Mundo. Se conserva la respuesta original del banco, pero para el examen usa Lutzomyia (probable error del banco)."],["Vector","El vector de la leishmaniasis: (Leishmaniasis P7).","“La manta blanca”.","Pendiente de verificación: nombre popular que no aparece en atlas ni diapositivas."],["Diagnóstico","Para el diagnóstico de la leishmaniasis visceral se recomienda (Leishmaniasis P5; revaluación Ex.3 P8).","Hemograma, punción de médula, ganglios linfáticos e hígado (biopsias).","Coincide con atlas y diapositivas; el atlas añade el bazo (el más sensible, &gt;95 %)."],["Tratamiento","Tratamiento de la leishmaniasis mucocutánea (Leishmaniasis P3).","Anfotericina B 25–50 mg/kg, antimoniato 60–100 mg/kg y estibogluconato 600 mg/kg (esquemas tal como aparecen en el PDF).","⚠ Dosis y unidades inconsistentes con las demás fuentes: no son pauta válida. Qué fármacos: antimoniales de elección; anfotericina B, de segunda línea. <span class=tag>docx</span> da otro esquema (Glucantime, pentamidina, anfotericina B)."],["Clínica","En la leishmaniosis mucocutánea, la destrucción del septum nasal produce el signo de… <span class=tag>docx</span>","El docx responde ROMAÑA–MAZZA.","Pendiente de verificación: ese signo no aparece en el atlas ni en las diapositivas, que mencionan nariz de tapir y cruz de Escomel."]];
const SQ=[["Morfología","¿Qué forma es intracelular, ovoide, sin flagelo libre y con quinetoplasto en bastón?",["Amastigoto","Promastigoto","Epimastigote","Tripomastigote"],"Es la forma intracelular en macrófagos."],["Morfología","¿Qué forma se halla en el tubo digestivo del vector y en los cultivos?",["Promastigoto","Amastigoto","Quiste","Esporozoito"],"Fusiforme y flagelada."],["Vector","Género vector en el Nuevo Mundo:",["Lutzomyia","Phlebotomus","Anopheles","Triatoma"],"Phlebotomus es del Viejo Mundo."],["Vector","¿Quién transmite la enfermedad?",["La hembra hematófaga del flebótomo","El macho del flebótomo","Ambos sexos por igual","Solo larvas"],"La hembra requiere sangre para reproducirse."],["Especies","¿Cuál NO figura entre las especies identificadas en Perú?",["L. tropica","L. peruviana","L. lainsoni","L. amazonensis"],"L. tropica es del Viejo Mundo."],["Epidemiología","¿Dónde no hay casos autóctonos de LV?",["Perú","India","Brasil","Sudán"],"Ecuador, Perú, Chile y Uruguay no reportan LV autóctona."],["Visceral","Hemograma de la leishmaniosis visceral:",["Anemia normocítica normocrómica, leucopenia con neutropenia y trombocitopenia","Eosinofilia con leucocitosis","Policitemia","Anemia macrocítica con linfocitosis"],"Es pancitopenia por compromiso medular."],["Visceral","Método parasitológico más sensible en LV:",["Punción esplénica","Intradermorreacción","Frotis de piel","Aglutinación directa"],"Más de 95 %, pero solo por clínico entrenado."],["Cutánea","Secuencia correcta de la lesión cutánea:",["Eritema, pápula, vesícula pustulosa, úlcera","Úlcera, pápula, nódulo, cicatriz","Nódulo, eritema, úlcera, vesícula","Vesícula, úlcera, eritema, pápula"],"Termina en úlcera cubierta por costra."],["Mucocutánea","La destrucción de la mucosa orofaríngea y nasal implica pérdida de:",["Cartílago, sin destrucción ósea","Hueso y cartílago","Solo hueso","Solo músculo"],"Atlas y diapositivas lo remarcan."],["Mucocutánea","La cruz de Escomel corresponde a lesión granulomatosa de:",["Paladar blando","Tabique nasal","Epiglotis","Lengua"],"El tabique amputado da nariz de tapir."],["Difusa","Leishmaniosis difusa:",["Anergia, lepromas y abundantes parásitos","Úlcera única con cicatriz","Pancitopenia y esplenomegalia","Lesión mucosa con cruz de Escomel"],"Hay escasa formación de úlceras."],["Viejo Mundo","Botón de Oriente seco y urbano:",["L. tropica","L. major","L. aethiopica","L. chagasi"],"L. major es húmedo y rural."],["Diagnóstico","Medio de cultivo habitual:",["NNN con sangre de conejo","Agar sangre","Löwenstein","Sabouraud"],"Incubar a 23 °C; positivo en 3–30 días."],["Tratamiento","Fármacos de elección:",["Antimoniales pentavalentes","Anfotericina B","Pentamidina","Aminosidina"],"Los otros son de segunda línea."],["Tratamiento","Contraindicación de los antimoniales:",["Gestación","Niñez","Anemia","Fiebre"],"Además, evaluar corazón, riñón e hígado."],["Diagnóstico","Montenegro en LV clásica grave suele ser:",["Negativa por anergia","Siempre positiva","Positiva a las 4 h","Indeterminada"],"Pápula ≥5 mm a las 48 h es positiva."],["Epidemiología","Transmisión rural afecta sobre todo a:",["Varones adultos","Niños &lt;4 años","Mujeres embarazadas","Lactantes"],"Por actividades agrícolas o en el bosque."]];
function show(i){cur=i;const m=$('#main');m.innerHTML='<section>'+M[i][1]()+`<p><button class="b g" onclick="mark()">Marcar como estudiado</button> <button class="b g" onclick="show(${Math.min(i+1,12)})">Siguiente módulo</button></p></section>`;
 document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('on',j==i));window.scrollTo(0,0);
 if(i==10)bRender();if(i==11)$('#mm').textContent=mode?'Examen':'Estudio';if(i==12)fcR();hl();}
function mark(){done.add(cur);nv();show(cur)}
function nv(){const n=$('#nav');n.innerHTML=M.map((m,i)=>`<button class="${done.has(i)?'done':''}" onclick="show(${i});n_close()">${m[0]}</button>`).join('');
 $('#pb').style.width=done.size/13*100+'%';$('#pt').textContent=done.size+' de 13 módulos estudiados';applyS();}
function n_close(){$('#nav').classList.remove('open')}
function setMode(x){mode=x;$('#mS').classList.toggle('on',!x);$('#mE').classList.toggle('on',!!x);if(cur==11)show(11)}
function stp(i){document.querySelectorAll('.step').forEach((s,j)=>{s.classList.toggle('on',j==i);s.querySelector('.ans').classList.toggle('show',j==i)})}
let term='';function applyS(){document.querySelectorAll('nav button').forEach((b,i)=>{const t=(M[i][0]+M[i][1]()).toLowerCase();b.style.display=!term||t.includes(term)?'':'none'})}
$('#srch').oninput=e=>{term=e.target.value.trim().toLowerCase();applyS();hl()};
function hl(){document.querySelectorAll('mark').forEach(k=>k.replaceWith(k.textContent));if(term.length<3)return;const w=document.createTreeWalker($('#main'),4);const ns=[];while(w.nextNode())ns.push(w.currentNode);
 ns.forEach(n=>{const x=n.nodeValue,k=x.toLowerCase().indexOf(term);if(k>=0&&n.parentNode.tagName!='SCRIPT'){const r=n.splitText(k);r.splitText(term.length);const mk=document.createElement('mark');mk.textContent=r.nodeValue;r.replaceWith(mk)}})}
let bs={};function bRender(){$('#bq').innerHTML=BQ.map((q,i)=>`<div class="card"><span class="tag">${q[0]}</span>${q[1]}<br><button class="b g" onclick="this.parentNode.querySelector('.ans').classList.add('show')">Mostrar respuesta</button><div class="ans"><b>Respuesta original:</b> ${q[2]}<p>${q[3]||'Sin discrepancias con las otras fuentes.'}</p><button class="b" onclick="bg(${i},1,this)">Acerté</button><button class="b g" onclick="bg(${i},0,this)">Fallé</button></div></div>`).join('');bc()}
function bg(i,v,b){bs[i]=v;b.parentNode.querySelectorAll('button').forEach(x=>x.disabled=true);bc()}
function bc(){const v=Object.values(bs);$('#bsc').textContent=`Correctas: ${v.filter(x=>x).length} · Incorrectas: ${v.filter(x=>!x).length} · Total: ${BQ.length}`}
function bReset(){bs={};bRender()}
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let sq=[],tid=null,left=0,graded=false;
function simStart(){clearInterval(tid);graded=false;sq=sh(SQ).map(q=>({t:q[0],q:q[1],o:sh(q[2]),c:q[2][0],e:q[3]}));
 $('#sim').innerHTML=sq.map((q,i)=>`<div class="q" id="q${i}"><span class="tag">${q.t}</span><b>${i+1}.</b> ${q.q}${q.o.map((o,j)=>`<label><input type="radio" name="r${i}" value="${j}" onchange="pick(${i})"> ${o}</label>`).join('')}<div class="fb" id="f${i}"></div></div>`).join('')+'<button class="b" onclick="grade()">Calificar</button> <button class="b g" onclick="simStart()">Rehacer con otro orden</button><div id="res"></div>';
 if(mode){left=Math.max(1,+$('#tm').value||20)*60;tick();tid=setInterval(tick,1000)}else $('#tmr').textContent=''}
function tick(){const m=Math.floor(left/60),s=left%60;$('#tmr').textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;if(left--<=0){clearInterval(tid);grade()}}
function sel(i){const r=document.querySelector(`input[name=r${i}]:checked`);return r?sq[i].o[+r.value]:null}
function fbk(i){const q=sq[i],s=sel(i),ok=s===q.c;document.querySelectorAll(`#q${i} label`).forEach((l,j)=>{l.classList.toggle('ok',q.o[j]===q.c);l.classList.toggle('no',q.o[j]===s&&!ok);l.querySelector('input').disabled=true});
 $('#f'+i).innerHTML=(s===null?'Sin responder. ':ok?'✔ Correcto. ':'✘ Incorrecto. ')+'Correcta: <b>'+q.c+'</b>. '+q.e}
function pick(i){if(!mode&&!graded)fbk(i)}
function grade(){if(graded)return;graded=true;clearInterval(tid);let ok=0;const bad={};sq.forEach((q,i)=>{fbk(i);if(sel(i)===q.c)ok++;else bad[q.t]=(bad[q.t]||0)+1});
 $('#res').innerHTML=`<div class="card"><div class="score">Nota: ${(ok/sq.length*20).toFixed(1)} / 20</div>Correctas: ${ok} · Incorrectas: ${sq.length-ok}<br><b>Temas por repasar:</b> ${Object.keys(bad).length?Object.entries(bad).map(([k,v])=>`<span class="tag">${k} (${v})</span>`).join(''):'ninguno, excelente'}</div>`;$('#res').scrollIntoView()}
let fi=0,fo=0,fd=FC.slice();function fcR(){const c=$('#fc');c.classList.toggle('back',!!fo);c.textContent=fo?fd[fi][1]:fd[fi][0];$('#fcn').textContent=`${fi+1} / ${fd.length}`;c.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();fcFlip()}}}
function fcFlip(){fo=!fo;fcR()}function fcMove(d){fi=(fi+d+fd.length)%fd.length;fo=0;fcR()}function fcShuf(){fd=sh(fd);fi=0;fo=0;fcR()}
nv();show(0);
</script></body></html>
